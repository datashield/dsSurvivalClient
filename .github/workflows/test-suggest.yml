name: Test setup suggestions

on:
  push:
    branches: ['**dev', '**ci-setup']
    paths: ['R/**']
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  suggest-docs:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: FlorianSchw/package-workflows/.github/workflows/test-suggest.yml@main
    with:
      datashield: true
      datashield-type: client
      accept-reasons: 'uncovered_branch, error_handling, edge_case'
      code-issue-confidence: 'high, medium'
      open-suggestion-pr: 'replace'
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TESTS }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-keepalive.yml@main
